<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>986Code Bridge</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="icons/icon64.png" alt="986Code" />
    <div>
      <h1>986Code Bridge</h1>
      <p>for ChatGPT · v0.1.0-alpha.5</p>
    </div>
    <span id="statusDot" class="dot"></span>
  </header>

  <main>
    <section class="card active-card">
      <div class="row between"><strong>Active tab</strong><button id="inspectBtn" class="ghost">Inspect</button></div>
      <div id="tabTitle" class="truncate">Loading…</div>
      <div id="tabUrl" class="muted truncate"></div>
    </section>

    <section class="card">
      <div class="row between"><strong>Bridge instance</strong><span id="controlStatus" class="muted">checking…</span></div>
      <div id="instanceLabelPopup" class="truncate">Loading…</div>
    </section>

    <section class="quick-grid">
      <button data-template="click">Click</button>
      <button data-template="type">Type</button>
      <button data-template="check">Tick</button>
      <button data-template="scroll">Scroll</button>
      <button data-template="read">Read</button>
      <button data-template="tabs">Tabs</button>
    </section>

    <section class="card">
      <div class="row between">
        <strong>Command</strong>
        <select id="mode">
          <option value="single">Single</option>
          <option value="batch">Batch</option>
        </select>
      </div>
      <textarea id="command" spellcheck="false"></textarea>
      <div class="row gap">
        <button id="runBtn" class="primary">Run command</button>
        <button id="clearBtn" class="ghost">Clear</button>
        <button id="optionsBtn" class="ghost icon-btn" title="Options">⚙</button>
      </div>
    </section>

    <section class="card result-card">
      <div class="row between"><strong>Result</strong><button id="copyBtn" class="ghost">Copy</button></div>
      <pre id="result">Ready.</pre>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
